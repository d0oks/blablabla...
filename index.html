<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0d14;--s1:#111827;--s2:#1a2332;--b2:rgba(255,255,255,.14);--red:rgba(220,38,38,.18);--red-h:rgba(220,38,38,.35);--gold:#f0b429;--cyan:#38bdf8;--green:#22c55e;--bad:#ef4444;--text:#c9d3e3;--muted:#8aa3be;--hp:'MedievalSharp',serif;--pad:max(16px,env(safe-area-inset-left))}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:linear-gradient(180deg,#0a0d14,#0d1119) fixed;color:var(--text);font:15px/1.5 'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.logo-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;background:rgba(10,13,20,.97);backdrop-filter:blur(24px);border-bottom:1px solid var(--red);box-shadow:0 1px 0 rgba(239,68,68,.35)}
.logo-bar svg{width:46px;height:46px;flex:none}
.logo-text-main,.f-logo,.grp-t{font-family:var(--hp);letter-spacing:.5px;background:linear-gradient(90deg,var(--gold),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-text-main{font-size:2.1rem;filter:drop-shadow(0 0 10px rgba(239,68,68,.35))}
.grp{padding:34px 0 26px;border-bottom:1px solid var(--red)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 var(--pad) 16px}
h2{display:flex;align-items:center;gap:12px;font-size:1.5rem;font-weight:700;color:#fff;letter-spacing:-.01em}
.gi,.ci{display:grid;place-items:center;flex:none;border:1px solid var(--red-h);background:var(--s2);color:var(--gold)}
.gi{width:44px;height:44px;border-radius:14px}.gi svg{width:24px;height:24px}
.ci{width:36px;height:36px;border-radius:11px}.ci svg{width:20px;height:20px}
.arr{display:flex;gap:8px}
.arr button{width:40px;height:40px;border-radius:50%;border:1px solid var(--b2);background:var(--s1);color:var(--cyan);font-size:1.1rem;cursor:pointer}
.arr button:hover{border-color:var(--red-h)}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:var(--pad);padding:4px var(--pad) 14px;overscroll-behavior-x:contain}
.card{position:relative;overflow:hidden;flex:0 0 min(78vw,300px);height:400px;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;padding:16px;background:linear-gradient(180deg,var(--s1),rgba(17,24,39,.95));border:1px solid var(--red);border-radius:16px;box-shadow:0 12px 32px -20px rgba(0,0,0,.85);transition:border-color .3s}
.card:hover{border-color:var(--red-h)}
.card>*{position:relative;z-index:1}
.card>.wm{position:absolute;z-index:0;right:-18px;top:-18px;width:130px;height:130px;color:var(--cyan);opacity:.07;pointer-events:none}
.ch{display:flex;align-items:center;gap:10px}
.card h3{font-size:1.05rem;font-weight:700;color:#fff}
.d{font-size:.82rem;color:var(--muted)}
.cb{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
label{display:grid;gap:4px;font-weight:600;font-size:.78rem;color:var(--muted)}
input,textarea,select{font:inherit;font-size:16px;width:100%;color:var(--text);background:var(--s2);border:1px solid var(--b2);border-radius:10px;padding:9px}
textarea{resize:none}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.drop{position:relative;display:grid;place-items:center;text-align:center;min-height:84px;padding:10px;border:1px dashed var(--b2);border-radius:12px;background:var(--s2);font-weight:600;font-size:.85rem;word-break:break-word}
.drop:focus-within{outline:2px solid var(--cyan);outline-offset:2px}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0}
.go{font:inherit;font-weight:700;color:#0a0d14;background:linear-gradient(90deg,var(--gold),var(--cyan));border:0;border-radius:10px;padding:11px;cursor:pointer}
.go:disabled{opacity:.5;cursor:wait}
.st{min-height:1.2em;font-size:.8rem}.st.err{color:var(--bad);font-weight:600}
.dlink{display:block;margin-top:6px;padding:9px;border:1px solid var(--green);border-radius:10px;color:var(--green);font-weight:600;font-size:.85rem;text-decoration:none;word-break:break-all}
.out img,.out canvas{max-width:100%;height:auto;border-radius:10px}
.qr canvas{display:none}
.bar{height:10px;border-radius:99px;background:var(--s2);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan))}
.res{font-size:.85rem}.res ul{margin:6px 0 0;padding-left:1.1em}.res small{display:block;margin-top:6px;color:var(--muted)}
footer{padding:18px 20px calc(18px + env(safe-area-inset-bottom));text-align:center}
.f-logo{font-size:1rem}
.grp-t{font-size:1.6rem;filter:drop-shadow(0 0 8px rgba(239,68,68,.3))}
.track{scrollbar-width:none}.track::-webkit-scrollbar{display:none}
:root{--e:cubic-bezier(.22,.8,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes nudge{50%{transform:translateX(-14px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dot{0%,60%,100%{opacity:.35;transform:scale(.8)}30%{opacity:1;transform:scale(1.25)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.85}100%{transform:translate(var(--dr),-54px);opacity:0}}
.grp:not(.in) .card{opacity:0}
.grp.in .card{animation:up .5s var(--e) calc(var(--i)*60ms) backwards}
.grp.in .card:first-child{animation:up .5s var(--e) backwards,nudge 1.1s var(--e) 1.4s}
.card{transition:border-color .3s,transform .25s var(--e),box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 36px -20px rgba(0,0,0,.9)}
.card>.wm{animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(8px) rotate(6deg)}}
.go{transition:transform .15s var(--e),opacity .2s}.go:active{transform:scale(.97)}
.go.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-2px;border:2px solid #0a0d14;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.bar i{transform-origin:left;animation:grow .9s var(--e)}
.res{animation:pop .4s var(--e)}
.dlink{animation:pop .4s var(--e)}
.dt{transform-box:fill-box;transform-origin:center;animation:dot 1.4s ease-in-out infinite}
.vapors{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.vapors span{position:absolute;bottom:6px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;border:1px solid rgba(240,180,41,.45);background:rgba(56,189,248,.1);opacity:0;animation:rise var(--t) var(--dl) ease-in infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.vapors{display:none}}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>

<body>
<header class="logo-bar">
  <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f0b429"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><path d="M7 7h24a4 4 0 0 1 4 4v13a4 4 0 0 1-4 4H19l-8 7v-7H7a4 4 0 0 1-4-4V11a4 4 0 0 1 4-4z" fill="#111827" stroke="url(#lg)" stroke-width="2.5" stroke-linejoin="round"/><circle class="dt" style="animation-delay:0.0s" cx="12" cy="17.5" r="2.3" fill="#f0b429"/><circle class="dt" style="animation-delay:0.25s" cx="19" cy="17.5" r="2.3" fill="#a8c76a"/><circle class="dt" style="animation-delay:0.5s" cx="26" cy="17.5" r="2.3" fill="#38bdf8"/><path d="M38 20h3a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4h-2v6l-6-6h-6a4 4 0 0 1-4-4v-2" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1 class="logo-text-main">Blablabla</h1>
  <div class="vapors" aria-hidden="true"><span style="--x:30%;--s:10px;--dr:-8px;--dl:0s;--t:5.5s"></span><span style="--x:38%;--s:7px;--dr:6px;--dl:1.8s;--t:6.5s"></span><span style="--x:46%;--s:12px;--dr:-4px;--dl:3.2s;--t:5s"></span><span style="--x:54%;--s:8px;--dr:8px;--dl:0.9s;--t:6s"></span><span style="--x:62%;--s:11px;--dr:-6px;--dl:2.6s;--t:7s"></span><span style="--x:70%;--s:7px;--dr:5px;--dl:4.1s;--t:5.5s"></span></div>
</header>

<script>
document.addEventListener('DOMContentLoaded', () => {
const $ = (s, r = document) => r.querySelector(s);
const F = (n, l, t = 'text', p = '') => `<label>${l}<input name="${n}" type="${t}" placeholder="${p}"></label>`;
const T = (n, l, r = 4, p = '') => `<label>${l}<textarea name="${n}" rows="${r}" placeholder="${p}"></textarea></label>`;
const base = f => f.name.replace(/\.[^.]+$/, '');
const dl = (el, blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.className = 'dlink'; a.textContent = 'Télécharger ' + name; el.append(a); };
const need = (f, n = 1) => { if (f.length < n) throw 'Choisis un fichier d\'abord.'; };
const clean = s => s.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

function writer() {
  const d = new jspdf.jsPDF({ unit: 'pt', format: 'a4' });
  let y = 56; const w = d.internal.pageSize.getWidth() - 112, H = d.internal.pageSize.getHeight() - 56;
  return { d, add(t, s = 11, b = 0, g = 6, c = 20) {
    d.setFont('helvetica', b ? 'bold' : 'normal'); d.setFontSize(s); d.setTextColor(c);
    for (const l of d.splitTextToSize(t, w)) { if (y > H) { d.addPage(); y = 56; } d.text(l, 56, y); y += s * 1.4; }
    y += g; } };
}
const t2p = text => { const w = writer(); w.add(text); return w.d.output('blob'); };
async function pdfPages(file) {
  const d = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise, out = [];
  for (let i = 1; i <= d.numPages; i++) { const c = await (await d.getPage(i)).getTextContent(); out.push(c.items.map(x => x.str + (x.hasEOL ? '\n' : ' ')).join('').trim()); }
  return out;
}

/* ---------- Détecteurs ---------- */
async function txt({ f, out }) {
  need(f); const x = f[0], nm = x.name.toLowerCase(); let t;
  if (nm.endsWith('.pdf')) t = (await pdfPages(x)).join('\n');
  else if (nm.endsWith('.docx')) t = (await mammoth.extractRawText({ arrayBuffer: await x.arrayBuffer() })).value;
  else t = await x.text();
  t = t.trim(); if (t.length < 200) throw 'Ce fichier contient trop peu de texte (200 caractères minimum).';
  const ss = t.split(/[.!?…]+\s+/).filter(x => x.length > 3), L = ss.map(x => x.split(/\s+/).length);
  const m = L.reduce((a, b) => a + b, 0) / L.length, sd = Math.sqrt(L.reduce((a, b) => a + (b - m) ** 2, 0) / L.length), cv = sd / m;
  const nw = t.split(/\s+/).length;
  const conn = (t.match(/\b(en outre|par ailleurs|de plus|en conclusion|il est important de|il convient de|dans un monde|n'hésitez pas|furthermore|moreover)\b/gi) || []).length * 100 / nw;
  const op = ss.map(x => x.split(/\s+/)[0].toLowerCase()), rep = 1 - new Set(op).size / op.length;
  const a = Math.max(0, Math.min(1, (0.6 - cv) / 0.3)) * 50, b = Math.min(25, conn * 12), c = Math.min(20, rep * 60);
  const sc = Math.round(Math.min(95, a + b + c));
  out.innerHTML = `<div class="res"><b>Score indicatif : ${sc} %</b><div class="bar"><i style="width:${sc}%"></i></div><ul>
    <li>Rythme des phrases : ${cv < 0.4 ? 'très régulier' : 'varié'}</li>
    <li>Connecteurs « typiques » : ${conn.toFixed(1)} pour 100 mots</li>
    <li>Débuts de phrases répétés : ${Math.round(rep * 100)} %</li></ul>
    <small>Indicatif, pas une preuve : ces détecteurs se trompent, surtout sur les textes courts ou écrits par des non-natifs.</small></div>`;
}
async function meta({ f, out }) {
  need(f); const x = f[0], parts = x.size > 6e6 ? [x.slice(0, 3e6), x.slice(-3e6)] : [x];
  let s = ''; for (const p of parts) s += new TextDecoder('latin1').decode(await p.arrayBuffer()); s = s.toLowerCase();
  const K = ['c2pa', 'jumbf', 'trainedalgorithmicmedia', 'midjourney', 'dall-e', 'stable diffusion', 'firefly', 'comfyui', 'synthid', 'openai'];
  const hit = K.filter(k => s.includes(k));
  out.innerHTML = `<div class="res"><b>${hit.length ? 'Marqueurs IA trouvés' : 'Aucun marqueur IA trouvé'}</b>` +
    (hit.length ? `<ul>${hit.map(k => `<li>${k}</li>`).join('')}</ul>` : '') +
    `<small>Analyse locale des métadonnées uniquement. L'absence de marqueur ne prouve pas que le fichier est authentique : les métadonnées sont souvent supprimées.</small></div>`;
}

/* ---------- Convertisseurs ---------- */
async function pdfWord({ f, st, out }) {
  need(f); const pages = await pdfPages(f[0]); st('Création du Word…');
  const esc = s => clean(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const p = pages.map(pg => pg.split(/\n+/).map(l => `<w:p><w:r><w:t xml:space="preserve">${esc(l)}</w:t></w:r></w:p>`).join('')).join('<w:p><w:r><w:br w:type="page"/></w:r></w:p>');
  const z = new JSZip();
  z.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="r1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/document.xml', '<?xml version="1.0" encoding="UTF-8"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + p + '</w:body></w:document>');
  dl(out, await z.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }), base(f[0]) + '.docx');
  return 'Terminé (texte seul, sans la mise en page).';
}
async function wordPdf({ f, out }) {
  need(f); const r = await mammoth.extractRawText({ arrayBuffer: await f[0].arrayBuffer() });
  dl(out, t2p(r.value), base(f[0]) + '.pdf'); return 'Terminé (texte seul, sans la mise en page).';
}
async function pdfImg({ f, st, out }) {
  need(f); const d = await pdfjsLib.getDocument({ data: await f[0].arrayBuffer() }).promise, z = new JSZip(), n = base(f[0]);
  for (let i = 1; i <= d.numPages; i++) {
    st(`Page ${i}/${d.numPages}…`);
    const p = await d.getPage(i), vp = p.getViewport({ scale: 2 }), c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height; await p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    const bl = await new Promise(r => c.toBlob(r, 'image/png'));
    if (d.numPages === 1) return dl(out, bl, n + '.png');
    z.file(`${n}-${i}.png`, bl);
  }
  dl(out, await z.generateAsync({ type: 'blob' }), n + '-images.zip');
}
async function imgPdf({ f, out }) {
  need(f); let d;
  for (const x of f) {
    const im = new Image(); im.src = URL.createObjectURL(x); await im.decode();
    const c = document.createElement('canvas'), k = c.getContext('2d'); c.width = im.naturalWidth; c.height = im.naturalHeight;
    k.fillStyle = '#fff'; k.fillRect(0, 0, c.width, c.height); k.drawImage(im, 0, 0);
    const w = 595, h = Math.round(c.height * w / c.width), o = h < w ? 'l' : 'p';
    if (!d) d = new jspdf.jsPDF({ unit: 'pt', format: [w, h], orientation: o }); else d.addPage([w, h], o);
    d.addImage(c.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, w, h);
  }
  dl(out, d.output('blob'), (f.length > 1 ? 'images' : base(f[0])) + '.pdf');
}
async function epubPdf({ f, st, out }) {
  need(f); const z = await JSZip.loadAsync(f[0]), rd = p => z.file(p).async('string'), dp = new DOMParser();
  const opfPath = dp.parseFromString(await rd('META-INF/container.xml'), 'text/xml').querySelector('rootfile').getAttribute('full-path');
  const dir = opfPath.replace(/[^/]*$/, ''), opf = dp.parseFromString(await rd(opfPath), 'text/xml'), man = {};
  opf.querySelectorAll('manifest > item').forEach(i => man[i.getAttribute('id')] = i.getAttribute('href'));
  const parts = [];
  for (const r of opf.querySelectorAll('spine > itemref')) {
    const fl = z.file(decodeURI(dir + man[r.getAttribute('idref')])); if (!fl) continue;
    st('Lecture des chapitres…');
    const doc = dp.parseFromString(await fl.async('string'), 'text/html');
    parts.push([...doc.querySelectorAll('h1,h2,h3,h4,p,li')].map(e => e.textContent.trim()).filter(Boolean).join('\n\n'));
  }
  if (!parts.join('').trim()) throw 'Impossible de lire cet ePub (fichier protégé ou inhabituel).';
  dl(out, t2p(parts.join('\n\n')), base(f[0]) + '.pdf'); return 'Terminé (texte seul, sans images).';
}

/* ---------- Autres outils ---------- */
async function gif({ f, v, st, out }) {
  need(f); const vd = document.createElement('video'); vd.muted = true; vd.playsInline = true; vd.src = URL.createObjectURL(f[0]);
  await new Promise((r, j) => { vd.onloadedmetadata = r; vd.onerror = () => j('Vidéo illisible.'); });
  const s = +v.gs || 0, dur = Math.min(+v.gd || 3, 6), fps = +v.gf, W = Math.min(480, vd.videoWidth), H = Math.round(vd.videoHeight * W / vd.videoWidth);
  const wk = URL.createObjectURL(await (await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')).blob());
  const g = new GIF({ workers: 2, quality: 10, width: W, height: H, workerScript: wk });
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  for (let t = s; t < s + dur && t < vd.duration; t += 1 / fps) {
    st(`Image à ${t.toFixed(1)} s…`); vd.currentTime = t; await new Promise(r => vd.onseeked = r);
    x.drawImage(vd, 0, 0, W, H); g.addFrame(x, { copy: true, delay: 1000 / fps });
  }
  st('Assemblage du GIF…');
  const bl = await new Promise(r => { g.on('finished', r); g.render(); });
  const im = new Image(); im.src = URL.createObjectURL(bl); out.append(im); dl(out, bl, base(f[0]) + '.gif');
}
function cv({ v, out }) {
  if (!v.n) throw 'Indique ton nom.'; const w = writer(), L = v.ty === 'lettre';
